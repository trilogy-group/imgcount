[project]
name = "imgcount"
version = "0.2.0"
description = "Image generation and analysis platform for evaluating generative numeracy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    # Core
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "aiofiles>=23.0.0",
    "pydantic>=2.0.0",

    # API Clients
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "fal-client>=0.5.0",

    # Image Processing
    "pillow>=10.0.0",
    "numpy>=1.26.0",

    # Quality Assessment
    "pyiqa>=0.1.10",
    "torch>=2.0.0",
    "torchvision>=0.15.0",

    # Metrics
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "statsmodels>=0.14.0",

    # Experiment Tracking (optional)
    "wandb>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
